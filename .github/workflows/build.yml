name: CPU bootstrap

on: [push, pull_request, workflow_dispatch]

jobs:
  runtime:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: default
            configure: linux-headless
            build: linux-headless
          - os: windows-latest
            compiler: clang
            configure: windows-headless
            build: windows-headless
          - os: windows-latest
            compiler: msvc
            configure: windows-msvc-headless
            build: windows-msvc-headless
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        if: matrix.compiler != 'msvc'
        run: cmake --preset ${{ matrix.configure }}
      - name: Configure MSVC compatibility build
        if: matrix.compiler == 'msvc'
        run: cmake --preset windows-msvc-headless -G "Visual Studio 17 2022"
      - name: Build
        run: cmake --build --preset ${{ matrix.build }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.build }}
